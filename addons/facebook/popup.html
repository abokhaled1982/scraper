<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      min-height: 420px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      background: #0f1117;
      color: #e0e0e0;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1877f2 0%, #0a5ac0 100%);
      padding: 12px 14px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 20px; }
    .header-title { font-size: 14px; font-weight: 700; color: #fff; }
    .header-ver { font-size: 10px; color: rgba(255,255,255,0.6); margin-left: auto; }

    /* ── Status Card ── */
    .status-card {
      margin: 10px;
      border-radius: 8px;
      background: #1a1d27;
      border: 1px solid #2a2d3e;
      overflow: hidden;
    }
    .status-row {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 8px;
      border-bottom: 1px solid #2a2d3e;
    }
    .status-row:last-child { border-bottom: none; }
    .status-label {
      color: #888;
      width: 70px;
      flex-shrink: 0;
      font-size: 11px;
    }
    .status-value { font-size: 11px; font-weight: 500; flex: 1; }

    /* ── State Badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .badge.disconnected { background: #2a2020; color: #f44; }
    .badge.disconnected .dot { background: #f44; }
    .badge.connecting   { background: #2a2515; color: #fa0; }
    .badge.connecting .dot { background: #fa0; animation: pulse 1s infinite; }
    .badge.handshake    { background: #2a2515; color: #fa0; }
    .badge.handshake .dot { background: #fa0; animation: pulse 0.6s infinite; }
    .badge.ready        { background: #152a1e; color: #4caf50; }
    .badge.ready .dot   { background: #4caf50; }
    .badge.busy         { background: #1a1f35; color: #64b5f6; }
    .badge.busy .dot    { background: #64b5f6; animation: pulse 0.4s infinite; }
    .badge.error        { background: #2a1515; color: #f44; }
    .badge.error .dot   { background: #f44; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── Activity Bar ── */
    .activity-bar {
      margin: 0 10px 10px;
      background: #1a1d27;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 8px 12px;
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .activity-icon { font-size: 14px; }
    .activity-text { font-size: 11px; color: #aaa; flex: 1; }
    .activity-text.active { color: #64b5f6; }

    /* ── Log Panel ── */
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 12px 4px;
      background: #1a1d27;
      border-top: 1px solid #2a2d3e;
    }
    .log-header span { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .log-clear { font-size: 10px; color: #555; cursor: pointer; }
    .log-clear:hover { color: #888; }
    .log-panel {
      height: 140px;
      overflow-y: auto;
      padding: 4px 0;
      background: #0f1117;
    }
    .log-entry {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 2px 12px;
      font-size: 10px;
      line-height: 1.5;
      border-bottom: 1px solid #16181f;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-ts   { color: #444; flex-shrink: 0; }
    .log-msg  { flex: 1; word-break: break-all; }
    .log-msg.info  { color: #bbb; }
    .log-msg.ok    { color: #4caf50; }
    .log-msg.warn  { color: #ffa726; }
    .log-msg.error { color: #ef5350; }

    /* ── Footer ── */
    .footer {
      padding: 8px 10px;
      background: #1a1d27;
      border-top: 1px solid #2a2d3e;
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 6px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #1877f2; color: #fff; }
    .btn-danger  { background: #c0392b; color: #fff; }
    .btn-neutral { background: #2a2d3e; color: #aaa; }
  </style>
</head>
<body>

  <div class="header">
    <span class="header-icon">🤖</span>
    <div>
      <div class="header-title">FB Deal Bot</div>
    </div>
    <span class="header-ver">v3.2</span>
  </div>

  <!-- Status Card -->
  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Status</span>
      <span id="stateBadge" class="badge disconnected">
        <span class="dot"></span>
        <span id="stateText">Getrennt</span>
      </span>
    </div>
    <div class="status-row">
      <span class="status-label">Server</span>
      <span class="status-value" id="wsUrl">ws://localhost:8080</span>
    </div>
    <div class="status-row">
      <span class="status-label">Puffer</span>
      <span class="status-value" id="pendingCount">0 Nachrichten</span>
    </div>
  </div>

  <!-- Activity -->
  <div class="activity-bar">
    <span class="activity-icon" id="activityIcon">💤</span>
    <span class="activity-text" id="activityText">Warte auf Verbindung...</span>
  </div>

  <!-- Log Panel -->
  <div class="log-header">
    <span>Live Log</span>
    <span class="log-clear" id="clearLog">löschen</span>
  </div>
  <div class="log-panel" id="logPanel"></div>

  <!-- Footer -->
  <div class="footer">
    <button class="btn btn-primary" id="goToPageBtn">📍 Profil öffnen</button>
    <button class="btn btn-neutral" id="refreshBtn">🔄 Refresh</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
